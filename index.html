<style>
  :root{
    --paper:#08090b;
    --paper-dark:#111319;
    --card:#0e1013;
    --card-raised:#15181d;
    --ink:#e8ebef;
    --ink-soft:#8a93a0;
    --stamp:#cf5140;
    --stamp-dark:#e8836f;
    --mustard:#3a7bb0;
    --blue-text:#7fb4e6;
    --green:#5fb87f;
    --line:rgba(255,255,255,0.07);
    --line-light:rgba(255,255,255,0.14);
    --shadow: 0 10px 30px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.4);
    --glow: 0 0 0 1px rgba(255,255,255,0.03) inset;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);
    background-image:
      radial-gradient(ellipse 900px 400px at 20% -10%, rgba(58,123,176,0.10), transparent 60%),
      radial-gradient(ellipse 700px 350px at 90% 0%, rgba(207,81,64,0.06), transparent 55%),
      linear-gradient(var(--paper-dark) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-dark) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 100% 34px, 34px 100%;
    background-position: 0 0, 0 0, 0 90px, 0 0;
    background-repeat: no-repeat, no-repeat, repeat, repeat;
    color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:22px 16px 80px;}
  header.hub{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;border-bottom:3px solid var(--mustard);padding-bottom:14px;}
  .hub-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:2.3rem;letter-spacing:-0.01em;line-height:1;margin:0;color:var(--ink);}
  .hub-title span{color:var(--stamp-dark);}
  .hub-sub{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--ink-soft);margin-top:6px;text-transform:uppercase;letter-spacing:0.08em;}
  .reg-no{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--ink-soft);text-align:right;line-height:1.5;}
  .week-bar{margin-top:8px;min-width:130px;}
  .week-bar-label{font-family:'IBM Plex Mono',monospace;font-size:0.66rem;color:var(--ink-soft);text-align:right;margin-bottom:4px;}
  .week-bar-track{height:6px;background:var(--paper-dark);border-radius:4px;overflow:hidden;border:1px solid var(--line);}
  .week-bar-fill{height:100%;background:linear-gradient(90deg,var(--mustard),var(--green));border-radius:4px;transition:width .3s ease;}

  nav.tabs{display:flex;gap:2px;margin-bottom:22px;flex-wrap:wrap;}
  .tab-btn{
    font-family:'IBM Plex Mono',monospace;font-size:0.78rem;letter-spacing:0.05em;text-transform:uppercase;
    padding:10px 16px 8px;background:var(--paper-dark);border:none;border-top-left-radius:8px;border-top-right-radius:8px;
    color:var(--ink-soft);cursor:pointer;position:relative;top:2px;border-bottom:2px solid transparent;
  }
  .tab-btn.active{background:var(--card);color:var(--blue-text);font-weight:600;border-bottom:2px solid var(--card);box-shadow:0 -2px 0 rgba(0,0,0,0.2) inset;}
  .panel{background:linear-gradient(180deg, var(--card-raised), var(--card));border-radius:12px;padding:22px;box-shadow:var(--shadow), var(--glow);border:1px solid var(--line);}

  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:0.82rem;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;
    background:var(--mustard);color:#eef3f9;transition:transform .08s ease, box-shadow .15s ease;
  }
  .btn:hover{box-shadow:0 0 0 3px rgba(58,123,176,0.18);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--line-light);}
  .btn.secondary:hover{box-shadow:0 0 0 3px rgba(255,255,255,0.06);}
  .btn.stamp-btn{background:var(--stamp);color:#fbeee9;}
  .btn.stamp-btn:hover{box-shadow:0 0 0 3px rgba(207,81,64,0.2);}
  .btn.small{padding:6px 11px;font-size:0.72rem;}
  .btn:disabled{opacity:0.4;cursor:default;}
  .btn:disabled:hover{box-shadow:none;}

  .analytics-bar{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:16px 20px;margin-bottom:18px;background:var(--card-raised);border:1px solid var(--line);border-radius:10px;}
  .analytics-ring-wrap{position:relative;width:140px;height:140px;flex-shrink:0;}
  .analytics-ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .analytics-ring-pct{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.8rem;color:var(--ink);line-height:1;}
  .analytics-ring-frac{font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--ink-soft);margin-top:4px;}
  .analytics-stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 28px;flex:1;min-width:180px;}
  .analytics-stat{text-align:left;}
  .analytics-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.5rem;line-height:1;color:var(--ink);}
  .analytics-stat[style*="color"] .analytics-num{color:inherit;}
  .analytics-label{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-top:3px;}
  .streak-panel{margin-bottom:18px;}
  .class-breakdown-panel{margin-bottom:18px;padding:16px 20px;background:var(--card-raised);border:1px solid var(--line);border-radius:10px;}
  .class-breakdown-title{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:12px;}
  .class-breakdown-row{margin-bottom:12px;}
  .class-breakdown-row:last-child{margin-bottom:0;}
  .class-breakdown-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap;}
  .class-breakdown-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .class-breakdown-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.88rem;color:var(--ink);flex:1;min-width:100px;}
  .class-breakdown-frac{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-soft);}
  .class-breakdown-track{height:7px;background:var(--paper);border-radius:5px;overflow:hidden;border:1px solid var(--line);}
  .class-breakdown-fill{height:100%;border-radius:5px;transition:width .3s ease;}
  .streak-hero{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--card-raised);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;}
  .streak-flame{font-size:2.2rem;line-height:1;flex-shrink:0;}
  .streak-hero-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.5rem;color:#d97706;}
  .streak-hero-sub{font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--ink-soft);margin-top:2px;}
  .streak-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
  .streak-stat{padding:14px 16px;background:var(--card-raised);border:1px solid var(--line);border-radius:10px;}
  .streak-stat-label{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin-bottom:6px;}
  .streak-stat-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.3rem;color:var(--ink);}
  .streak-stat-sub{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--ink-soft);margin-top:3px;}
  .class-group{margin-bottom:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);}
  .class-group summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px;user-select:none;}
  .class-group summary::-webkit-details-marker{display:none;}
  .class-group summary::before{content:'▸';font-size:0.75rem;color:var(--ink-soft);transition:transform .15s ease;flex-shrink:0;}
  .class-group[open] summary::before{transform:rotate(90deg);}
  .class-group-tab{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .class-group-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.02rem;color:var(--ink);flex:1;}
  .class-group-count{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-soft);background:var(--paper);padding:3px 9px;border-radius:12px;}
  .class-group > .cards-grid, .class-group > .empty{padding:0 16px 16px;}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .tiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .tile{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;background:var(--card-raised);border:1px solid var(--line);}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .tile-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent, rgba(0,0,0,0.8) 65%);padding:8px 10px 8px;font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:#fff;line-height:1.25;}
  .tile-sub{font-size:0.62rem;color:#d8d8d8;margin-top:1px;}
  .tile-badge{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,0.4);}
  .tile-add{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line-light);color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:0.85rem;background:transparent;gap:6px;}
  .card{
    background:var(--card-raised);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;position:relative;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,0.5);}
  .card:before{content:'';position:absolute;top:10px;left:10px;width:9px;height:9px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 3px rgba(0,0,0,0.6);}
  .card-tab{position:absolute;top:-9px;right:14px;font-family:'IBM Plex Mono',monospace;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.06em;color:#fff;padding:3px 8px;border-radius:5px 5px 0 0;}
  .card h3{font-family:'Space Grotesk',sans-serif;font-size:1.08rem;margin:14px 0 4px 22px;line-height:1.2;color:var(--ink);}
  .card .meta{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-soft);margin-left:22px;margin-bottom:10px;}
  .card .meta.class-desc{font-size:0.66rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .type-badge{display:inline-block;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.05em;padding:2px 7px;border-radius:3px;font-family:'IBM Plex Mono',monospace;margin-right:6px;color:#fff;}
  .card-actions{display:flex;gap:6px;margin-left:22px;flex-wrap:wrap;margin-top:8px;align-items:center;}
  .sync-status-row{margin-left:22px;margin-bottom:8px;}
  .sync-badge{display:inline-flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:0.66rem;letter-spacing:0.03em;padding:3px 10px;border-radius:12px;}
  .sync-badge-ok{background:var(--green);color:#eafbea;}
  .sync-badge-error{background:var(--stamp);color:#fbeee9;}
  .sync-badge-none{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line-light);}
  .class-card-tall .card-actions{margin-top:4px;}
  .card-delete-btn{padding:6px 10px;opacity:0.75;}
  .card-delete-btn:hover{opacity:1;color:var(--stamp-dark);border-color:var(--stamp-dark);}
  .filter-bar{margin-bottom:16px;padding:12px 14px;background:var(--card-raised);border:1px solid var(--line);border-radius:8px;}
  .filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .filter-row:last-child{margin-bottom:0;}
  .filter-row-label{font-family:'IBM Plex Mono',monospace;font-size:0.64rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-right:4px;min-width:52px;}
  .filter-chip{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;text-transform:capitalize;padding:4px 11px;border-radius:14px;border:1.5px solid var(--line-light);background:transparent;color:var(--ink-soft);cursor:pointer;transition:opacity .15s ease;}
  .filter-chip.on{color:#fff;opacity:1;}
  .filter-chip:not(.on){opacity:0.55;}
  .filter-chip:hover{opacity:1;}

  .empty{font-family:'IBM Plex Mono',monospace;font-size:0.85rem;color:var(--ink-soft);text-align:center;padding:30px 10px;border:1.5px dashed var(--line-light);border-radius:6px;}

  .modal-bg{position:fixed;inset:0;background:rgba(8,6,4,0.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:linear-gradient(180deg, var(--card-raised), var(--card));border:1px solid var(--line-light);border-radius:14px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto;box-shadow:var(--shadow);}
  .modal h3{font-family:'Space Grotesk',sans-serif;margin-top:0;color:var(--ink);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:4px;}
  .field input, .field select, .field textarea{
    width:100%;padding:8px 10px;border:1.5px solid var(--line-light);border-radius:5px;font-family:'Inter',sans-serif;font-size:0.9rem;background:var(--paper);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:50px;}
  .color-swatch{width:22px;height:22px;border-radius:5px;cursor:pointer;display:inline-block;}
  .icon-swatch{width:32px;height:32px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:var(--paper);border:1.5px solid var(--line-light);}
  .icon-swatch.picked{border-color:var(--mustard);background:var(--paper-dark);}

  .prop-row{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line);}
  .prop-row:last-child{border-bottom:none;}
  .prop-label{display:flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);}
  .prop-value{font-family:'Inter',sans-serif;font-size:0.9rem;color:var(--ink);padding-left:20px;word-break:break-word;}
  .prop-value.empty{color:var(--ink-soft);font-style:italic;}
  .prop-value a{color:var(--blue-text);}
  .prop-row input, .prop-row textarea{
    margin-left:20px;width:calc(100% - 20px);padding:6px 9px;border:1.5px solid var(--line-light);border-radius:5px;font-family:'Inter',sans-serif;font-size:0.88rem;background:var(--paper);color:var(--ink);
  }
  .prop-row textarea{resize:vertical;min-height:44px;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;min-width:640px;}
  .cal-grid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:4px;}
  .cal-dow{background:var(--mustard);color:#eef3f9;font-family:'IBM Plex Mono',monospace;font-size:0.62rem;text-align:center;padding:6px 2px;text-transform:uppercase;font-weight:600;}
  .cal-day{background:var(--card-raised);min-height:78px;padding:5px;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--ink-soft);position:relative;overflow:hidden;}
  .cal-day.off{background:var(--paper);opacity:0.5;}
  .cal-num{font-weight:600;color:var(--ink);}
  .cal-dot{display:block;width:100%;white-space:nowrap;font-size:0.58rem;background:var(--stamp);color:#fff;border-radius:3px;padding:1px 4px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;}
  .cal-more{display:block;font-size:0.58rem;color:var(--ink-soft);margin-top:3px;font-style:italic;}
  .cal-month-label{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;text-align:center;margin-bottom:12px;color:var(--ink);}

  .view-switch{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap;}
  .view-switch button{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.04em;padding:6px 12px;border-radius:4px;border:1px solid var(--line-light);background:transparent;color:var(--ink-soft);cursor:pointer;}
  .view-switch button.active{background:var(--mustard);color:#eef3f9;border-color:var(--mustard);}
  .agenda-day{border:1px solid var(--line);border-radius:4px;margin-bottom:10px;overflow:hidden;background:var(--card-raised);}

</div>

<script>
// ---- Supabase (replaces window.storage — works outside Claude.ai) ----
const SUPABASE_URL = 'https://iglhfnjckxjzevwjemcm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cEYJywaRkhBxqBwEuMxorg_JIyoACpZ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const CALSYNC_URL = `${SUPABASE_URL}/functions/v1/calendar-sync`;
const COURSE_COLORS = ['#2f6fa0','#d97706','#5fb87f','#8b6dbf','#c0453a','#6b7480'];
const TYPE_COLORS = {homework:'#2f6fa0', quiz:'#d97706', test:'#c0453a', project:'#8b6dbf', reading:'#5fb87f', other:'#6b7480'};
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
// Google Calendar's own colorId palette (Calendar API "Event colors")
const GOOGLE_COLOR_MAP = {
  '1':'#7986cb', '2':'#33b679', '3':'#8e24aa', '4':'#e67c73', '5':'#f6bf26',
  '6':'#f4511e', '7':'#039be5', '8':'#616161', '9':'#3f51b5', '10':'#0b8043', '11':'#d50000'
};
function courseDatalistHTML(id){
  return `<datalist id="${id}">${state.courses.map(c=>`<option value="${c.name}">`).join('')}</datalist>`;
}

const CLASS_ICONS = ['📘','📗','📙','📕','🧪','🔬','📐','📊','💻','🧮','⚙️','🎨','🎵','🏛️','🌐','🧬'];
function googleBadgeHTML(){
  return `<svg width="9" height="9" viewBox="0 0 10 10" style="display:inline-block;vertical-align:middle;margin-right:3px;flex-shrink:0;"><circle cx="2.6" cy="2.6" r="2.4" fill="#4285F4"/><circle cx="7.4" cy="2.6" r="2.4" fill="#EA4335"/><circle cx="2.6" cy="7.4" r="2.4" fill="#FBBC05"/><circle cx="7.4" cy="7.4" r="2.4" fill="#34A853"/></svg>`;
}

let state = { assignments: [], courses: [], settings: { calendarName: 'University of Michigan Schedule', calendarId: '', calendars: [], showSyncedDuplicates: false }, tab: 'cards', calendarOptions: null, googleEvents: {}, googleEventsYearLoaded: false, googleYearLoading: false, classGroupOpen: {} };

function getSyncTargets(){
  // returns [{id,name}, ...] — falls back to the legacy single-calendar field for anyone who set it up before multi-calendar support
  if(state.settings.calendars && state.settings.calendars.length>0) return state.settings.calendars;
  if(state.settings.calendarId) return [{id: state.settings.calendarId, name: state.settings.calendarName}];
  return [{id:'', name: state.settings.calendarName || 'primary calendar'}]; // name-based fallback, no id yet
}

function getAssignmentSyncTargets(){
  // assignments go to their own dedicated calendar if one's configured, so they don't clutter the class-schedule calendar
  if(state.settings.assignmentCalendarId){
    return [{id: state.settings.assignmentCalendarId, name: state.settings.assignmentCalendarName || 'Assignments'}];
  }
  return getSyncTargets(); // fall back to the shared class targets if no dedicated assignment calendar is set
}
const REMINDER_HOURS = [168, 72, 48, 24]; // 1 week, 3 days, 48h, 24h before

function assignmentToRow(a){
  return { id:a.id, title:a.title, course:a.course||'', type:a.type||'other', date:a.date||null, time:a.time||null,
    end_time:a.endTime||null, location:a.location||'', notes:a.notes||'', done:!!a.done, synced:!!a.synced,
    sync_error:!!a.syncError, google_event_ids:a.googleEventIds||{} };
}
function rowToAssignment(r){
  return { id:r.id, title:r.title, course:r.course||'', type:r.type||'other', date:r.date||'', time:(r.time||'').slice(0,5),
    endTime:(r.end_time||'').slice(0,5), location:r.location||'', notes:r.notes||'', done:r.done, synced:r.synced,
    syncError:r.sync_error, googleEventIds:r.google_event_ids||{} };
}
function courseToRow(c){
  return { id:c.id, name:c.name, icon:c.icon||'', color:c.color||'', course_number:c.courseNumber||'', credits:c.credits||'',
    description:c.description||'', professor:c.professor||'', office_hours:c.officeHours||'', canvas_link:c.canvasLink||'',
    quarter:c.quarter||'', location:c.location||'', days:c.days||[], start_time:c.startTime||null, end_time:c.endTime||null,
    term_ends:c.termEnds||null, synced:!!c.synced, sync_error:!!c.syncError, google_event_ids:c.googleEventIds||{} };
}
function rowToCourse(r){
  return { id:r.id, name:r.name, icon:r.icon||'', color:r.color||'', courseNumber:r.course_number||'', credits:r.credits||'',
    description:r.description||'', professor:r.professor||'', officeHours:r.office_hours||'', canvasLink:r.canvas_link||'',
    quarter:r.quarter||'', location:r.location||'', days:r.days||[], startTime:(r.start_time||'').slice(0,5),
    endTime:(r.end_time||'').slice(0,5), termEnds:r.term_ends||'', synced:r.synced, syncError:r.sync_error,
    googleEventIds:r.google_event_ids||{} };
}

async function loadState(){
  try{
    const { data, error } = await sb.from('assignments').select('*').order('created_at', {ascending:true});
    if(error) throw error;
    state.assignments = (data||[]).map(rowToAssignment);
  }catch(e){ console.error('load assignments failed', e); state.assignments = []; }
  try{
    const { data, error } = await sb.from('courses').select('*').order('created_at', {ascending:true});
    if(error) throw error;
    state.courses = (data||[]).map(rowToCourse);
  }catch(e){ console.error('load courses failed', e); state.courses = []; }
  try{
    const { data, error } = await sb.from('app_settings').select('*').eq('id', true).maybeSingle();
    if(error) throw error;
    if(data){
      const calendars = data.calendars || [];
      state.settings = { calendarName: data.calendar_name || (calendars[0]?.name || 'University of Michigan Schedule'),
        calendarId: calendars[0]?.id || '', calendars, bestStreak: data.best_streak || 0,
        assignmentCalendarId: data.assignment_calendar_id || '', assignmentCalendarName: data.assignment_calendar_name || '' };
    }
  }catch(e){ console.error('load settings failed', e); }
  render();
}
async function saveAssignments(){
  try{
    // full-sync strategy: replace table contents with current in-memory state. Fine at personal-project scale.
    const { error: delErr } = await sb.from('assignments').delete().neq('id', '__never__');
    if(delErr) throw delErr;
    if(state.assignments.length>0){
      const { error: insErr } = await sb.from('assignments').insert(state.assignments.map(assignmentToRow));
      if(insErr) throw insErr;
    }
  }catch(e){ console.error('save assignments failed', e); }
}
async function saveCourses(){
  try{
    const { error: delErr } = await sb.from('courses').delete().neq('id', '__never__');
    if(delErr) throw delErr;
    if(state.courses.length>0){
      const { error: insErr } = await sb.from('courses').insert(state.courses.map(courseToRow));
      if(insErr) throw insErr;
    }
  }catch(e){ console.error('save courses failed', e); }
}
async function saveSettings(){
  try{
    const { error } = await sb.from('app_settings').update({
      calendar_name: state.settings.calendarName || '',
      calendars: state.settings.calendars || [],
      best_streak: state.settings.bestStreak || 0
    }).eq('id', true);
    if(error) throw error;
  }catch(e){ console.error('save settings failed', e); }
}

function courseColor(course){
  const defined = state.courses.find(c=>c.name.toLowerCase()===((course||'').toLowerCase()));
  if(defined) return defined.color;
  const list = [...new Set(state.assignments.map(a=>a.course))];
  const idx = list.indexOf(course);
  return COURSE_COLORS[idx % COURSE_COLORS.length] || '#3a5a7a';
}
function fmtTime(t){
  if(!t) return '';
  const [h,min] = t.split(':').map(Number);
  const period = h>=12 ? 'PM' : 'AM';
  const h12 = h%12===0 ? 12 : h%12;
  return `${h12}:${String(min).padStart(2,'0')}${period}`;
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function daysUntil(iso){
  const d = new Date(iso+'T00:00:00'); const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}

function render(){
  const open = state.assignments.filter(a=>!a.done).length;
  document.getElementById('regNo').innerHTML = `ASSIGNMENTS: ${state.assignments.length}<br>NOT COMPLETED: ${open}`;

  const weekStart = mondayOf(new Date().toISOString().slice(0,10));
  const weekEndDate = new Date(weekStart+'T00:00:00'); weekEndDate.setDate(weekEndDate.getDate()+6);
  const weekEnd = weekEndDate.toISOString().slice(0,10);
  const weekItems = state.assignments.filter(a=>a.date && a.date>=weekStart && a.date<=weekEnd);
  const weekDone = weekItems.filter(a=>a.done).length;
  const weekPct = weekItems.length>0 ? Math.round((weekDone/weekItems.length)*100) : 0;
  const weekBar = document.getElementById('weekBar');
  if(weekBar){
    weekBar.innerHTML = weekItems.length===0
      ? `<div class="week-bar-label">This week: nothing due</div>`
      : `<div class="week-bar-label">This week: ${weekDone}/${weekItems.length} done</div>
         <div class="week-bar-track"><div class="week-bar-fill" style="width:${weekPct}%;"></div></div>`;
  }

  const tabs = document.getElementById('tabs');
  tabs.innerHTML = ['cards:Dashboard','classes:Classes','calendar:Calendar','scan:Scan Syllabus','settings:Settings'].map(t=>{
    const [id,label] = t.split(':');
    return `<button class="tab-btn ${state.tab===id?'active':''}" data-tab="${id}">${label}</button>`;
  }).join('');
  tabs.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab; render();});

  const host = document.getElementById('panelHost');
  if(state.tab==='cards') host.innerHTML = renderCards();
  else if(state.tab==='classes') host.innerHTML = renderClasses();
  else if(state.tab==='calendar') host.innerHTML = renderCalendar();
  else if(state.tab==='scan') host.innerHTML = renderScan();
  else host.innerHTML = renderSettings();
  attachHandlers();

  if(state.tab==='calendar' && !state.googleYearLoading){
    const { y, m } = currentRefMonth();
    const key = `${y}-${m}`;
    const loaded = state.googleLoadedMonths && state.googleLoadedMonths[key];
    if(!loaded) pullGoogleEvents();
  }
}

function computeStreak(){
  // streak = consecutive days with nothing currently sitting overdue.
  // if anything is overdue right now, the streak is broken (0).
  // otherwise, it's the number of days since the most recent past-due date that was fully handled.
  const overdue = state.assignments.filter(a=>!a.done && a.date && daysUntil(a.date)<0);
  if(overdue.length>0) return 0;
  const pastDates = state.assignments.filter(a=>a.date && daysUntil(a.date)<=0).map(a=>a.date);
  if(pastDates.length===0) return 0; // nothing due yet to have a streak from
  const mostRecent = pastDates.sort().reverse()[0];
  return Math.max(0, -daysUntil(mostRecent));
}

function renderClassBreakdown(){
  const rows = state.courses.map(c=>{
    const items = state.assignments.filter(a=>assignmentMatchesCourse(a,c));
    if(items.length===0) return null;
    const done = items.filter(a=>a.done).length;
    const overdue = items.filter(a=>!a.done && a.date && daysUntil(a.date)<0).length;
    const pct = Math.round((done/items.length)*100);
    return `<div class="class-breakdown-row">
      <div class="class-breakdown-head">
        <span class="class-breakdown-dot" style="background:${c.color};"></span>
        <span class="class-breakdown-name">${c.icon||'📘'} ${c.name}</span>
        <span class="class-breakdown-frac">${done}/${items.length}${overdue>0?` · <span style="color:var(--stamp-dark);">${overdue} overdue</span>`:''}</span>
      </div>
      <div class="class-breakdown-track"><div class="class-breakdown-fill" style="width:${pct}%;background:${c.color};"></div></div>
    </div>`;
  }).filter(Boolean);

  const unmatched = state.assignments.filter(a=>!state.courses.some(c=>assignmentMatchesCourse(a,c)));
  if(unmatched.length>0){
    const done = unmatched.filter(a=>a.done).length;
    const pct = Math.round((done/unmatched.length)*100);
    rows.push(`<div class="class-breakdown-row">
      <div class="class-breakdown-head">
        <span class="class-breakdown-dot" style="background:#6b7480;"></span>
        <span class="class-breakdown-name">📎 Other / Unmatched</span>
        <span class="class-breakdown-frac">${done}/${unmatched.length}</span>
      </div>
      <div class="class-breakdown-track"><div class="class-breakdown-fill" style="width:${pct}%;background:#6b7480;"></div></div>
    </div>`);
  }

  if(rows.length===0) return '';
  return `
  <div class="class-breakdown-panel">
    <div class="class-breakdown-title">By Class</div>
    ${rows.join('')}
  </div>`;
}

function renderStreakPanel(){
  const streak = computeStreak();
  if(streak > (state.settings.bestStreak||0)){
    state.settings.bestStreak = streak;
    saveSettings(); // fire and forget, no need to block render
  }
  const broken = streak===0 && state.assignments.some(a=>!a.done && a.date && daysUntil(a.date)<0);
  return `
  <div class="streak-panel">
    <div class="streak-hero">
      <span class="streak-flame">🔥</span>
      <div>
        <div class="streak-hero-num">${streak} day${streak===1?'':'s'}</div>
        <div class="streak-hero-sub">${broken?'Streak reset — something is overdue':'without missing a due date'}</div>
      </div>
    </div>
    <div class="streak-stats">
      <div class="streak-stat">
        <div class="streak-stat-label">🔥 Streak</div>
        <div class="streak-stat-num">${streak} day${streak===1?'':'s'}</div>
        <div class="streak-stat-sub">Without missing a task</div>
      </div>
      <div class="streak-stat">
        <div class="streak-stat-label">🏆 Best Streak</div>
        <div class="streak-stat-num">${state.settings.bestStreak||0} day${(state.settings.bestStreak||0)===1?'':'s'}</div>
        <div class="streak-stat-sub">Your personal record</div>
      </div>
    </div>
  </div>`;
}

function assignmentMatchesCourse(a, c){
  if(!a.course) return false;
  const ac = a.course.toLowerCase().trim();
  return (c.name && ac===c.name.toLowerCase().trim()) || (c.courseNumber && ac===c.courseNumber.toLowerCase().trim());
}

function renderCards(){
  const sorted = [...state.assignments].sort((a,b)=> (a.done - b.done) || (a.date||'').localeCompare(b.date||''));
  const total = state.assignments.length;
  const completed = state.assignments.filter(a=>a.done).length;
  const open = total - completed;
  const overdue = state.assignments.filter(a=>!a.done && a.date && daysUntil(a.date)<0).length;
  const dueSoon = state.assignments.filter(a=>!a.done && a.date && daysUntil(a.date)>=0 && daysUntil(a.date)<=3).length;
  const pct = total>0 ? Math.round((completed/total)*100) : 0;
  const R = 54, C = 2*Math.PI*R;
  const dashOffset = C - (pct/100)*C;

  return `
  <div class="panel">
    ${total>0 ? `
    <div class="analytics-bar">
      <div class="analytics-ring-wrap">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--paper)" stroke-width="14"/>
          <circle cx="70" cy="70" r="${R}" fill="none" stroke="url(#ringGrad)" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${dashOffset}"
            transform="rotate(-90 70 70)" style="transition:stroke-dashoffset .4s ease;"/>
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:var(--mustard);"/>
              <stop offset="100%" style="stop-color:var(--green);"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="analytics-ring-center">
          <div class="analytics-ring-pct">${pct}%</div>
          <div class="analytics-ring-frac">${completed}/${total}</div>
        </div>
      </div>
      <div class="analytics-stats-grid">
        <div class="analytics-stat">
          <div class="analytics-num">${total}</div>
          <div class="analytics-label">Total</div>
        </div>
        <div class="analytics-stat" style="color:var(--green);">
          <div class="analytics-num">${completed}</div>
          <div class="analytics-label">Completed</div>
        </div>
        <div class="analytics-stat" style="color:var(--blue-text);">
          <div class="analytics-num">${open}</div>
          <div class="analytics-label">Open</div>
        </div>
        <div class="analytics-stat" style="color:${overdue>0?'var(--stamp-dark)':'var(--ink-soft)'};">
          <div class="analytics-num">${overdue}</div>
          <div class="analytics-label">Overdue</div>
        </div>
        <div class="analytics-stat" style="color:${dueSoon>0?'#d97706':'var(--ink-soft)'};">
          <div class="analytics-num">${dueSoon}</div>
          <div class="analytics-label">Due in 3d</div>
        </div>
      </div>
    </div>` : ''}
    ${total>0 ? renderStreakPanel() : ''}
    ${total>0 ? renderClassBreakdown() : ''}
    <div class="row">
      <strong style="font-family:'Space Grotesk',sans-serif;font-size:1.15rem;">Assignment Cards</strong>
      <button class="btn stamp-btn" id="addBtn">+ New Entry</button>
    </div>
    ${total>0 ? renderFilterBar() : ''}
    ${sorted.length===0 ? `<div class="empty">No assignments logged yet. Add one manually or scan a syllabus.</div>` : renderGroupedCards(applyCardFilters(sorted))}
  </div>`;
}

function applyCardFilters(list){
  const cf = state.cardFilters;
  if(!cf) return list;
  return list.filter(a=>{
    if(cf.types && !cf.types.has(a.type||'other')) return false;
    if(cf.classes){
      const key = classKeyFor(a);
      if(!cf.classes.has(key)) return false;
    }
    return true;
  });
}

function classKeyFor(a){
  const match = state.courses.find(c=>assignmentMatchesCourse(a,c));
  return match ? match.id : '__other';
}

function ensureCardFilters(){
  if(!state.cardFilters){
    state.cardFilters = {
      classes: new Set([...state.courses.map(c=>c.id), '__other']),
      types: new Set(['homework','quiz','test','project','reading','other'])
    };
  }
  return state.cardFilters;
}

function renderFilterBar(){
  const cf = ensureCardFilters();
  const classChips = [...state.courses, {id:'__other', name:'Other', icon:'📎', color:'#6b7480'}]
    .filter(c => state.assignments.some(a=>classKeyFor(a)===c.id))
    .map(c=>{
      const on = cf.classes.has(c.id);

function renderGroupedCards(sorted){
  const groups = state.courses.map(c=>({
    key: c.id, label: `${c.icon||'📘'} ${c.name}`, color: c.color,
    items: sorted.filter(a=>assignmentMatchesCourse(a,c))
  }));
  const claimed = new Set();
  groups.forEach(g=>g.items.forEach(a=>claimed.add(a.id)));
  const unmatched = sorted.filter(a=>!claimed.has(a.id));
  if(unmatched.length>0) groups.push({key:'__other', label:'📎 Other / Unmatched', color:'#6b7480', items:unmatched});

  return groups.filter(g=>g.items.length>0 || state.courses.some(c=>c.id===g.key)).map(g=>{
    const doneCount = g.items.filter(a=>a.done).length;
    const isOpen = state.classGroupOpen[g.key] !== false; // default open
    return `<details class="class-group" data-group-key="${g.key}" ${isOpen?'open':''}>
      <summary>
        <span class="class-group-tab" style="background:${g.color||'#6b7480'};"></span>
        <span class="class-group-label">${g.label}</span>
        <span class="class-group-count">${doneCount}/${g.items.length}</span>
      </summary>
      ${g.items.length===0
        ? `<div class="empty" style="margin-top:10px;">No assignments logged for this class yet.</div>`
        : `<div class="cards-grid" style="margin-top:12px;">${g.items.map(renderAssignmentCard).join('')}</div>`}
    </details>`;
  }).join('');
}

let clickableItems = [];
function registerClickable(it){
  clickableItems.push(it);
  return clickableItems.length - 1;
}

function getKnownSyncedEventIds(){
  const ids = new Set();
  state.assignments.forEach(a=>{ if(a.googleEventIds) Object.values(a.googleEventIds).forEach(id=>id && ids.add(id)); });
  state.courses.forEach(c=>{ if(c.googleEventIds) Object.values(c.googleEventIds).forEach(id=>id && ids.add(id)); });
  return ids;
}

function buildDayItems(y,m,d){
  const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const weekday = DOW[new Date(y,m,d).getDay()];
  const monthKey = `${y}-${m}`;
  const gEvents = state.googleEvents[monthKey] || [];
  const cf = ensureCardFilters();
  let assignToday = state.assignments.filter(a=>a.date===iso && a.synced);
  let classesToday = state.courses.filter(c=>(c.days||[]).includes(weekday) && c.synced);
  assignToday = assignToday.filter(a=> cf.types.has(a.type||'other') && cf.classes.has(classKeyFor(a)));
  classesToday = classesToday.filter(c=> cf.classes.has(c.id));
  const knownIds = state.settings.showSyncedDuplicates ? null : getKnownSyncedEventIds();
  const isKnown = (e)=> knownIds.has(e.id) || [...knownIds].some(id => e.id.startsWith(id+'_')); // recurring instances are "{seriesId}_{timestamp}"
  const googleToday = gEvents.filter(e=> e.date===iso && (state.settings.showSyncedDuplicates || !isKnown(e)));
  let items = [
    ...classesToday.map(c=>({time:c.startTime||'', timeLabel: c.startTime?`${fmtTime(c.startTime)}${c.endTime?'–'+fmtTime(c.endTime):''}`:'', title:`${c.icon||'📘'} ${c.name}`, sub:`Class${c.location?' · '+c.location:''}`, bg:c.color, kind:'class', ref:c})),
    ...assignToday.map(a=>({time:a.time||'', timeLabel: a.time?`${fmtTime(a.time)}${a.endTime?'–'+fmtTime(a.endTime):''}`:'', title:a.title, sub:`${a.type}${a.course?' · '+a.course:''}${a.location?' · '+a.location:''}`, bg:courseColor(a.course), kind:'assignment', ref:a})),
    ...googleToday.map(e=>({time:e.time||'', timeLabel: e.time?`${fmtTime(e.time)}${e.endTime?'–'+fmtTime(e.endTime):''}`:'All day', title:e.title, sub:`${e.calendarName||'Google Calendar'}${e.location?' · '+e.location:''}`, bg:e.color||'#4285F4', kind:'google', ref:e}))
  ];
  items.sort((x,y2)=>(x.time||'99:99').localeCompare(y2.time||'99:99'));
  return {iso, items};
}

function renderMonthGrid(){
  const now = new Date();
  const y = state.calY ?? now.getFullYear();
  const m = state.calM ?? now.getMonth();
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const label = first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-day off"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const {items} = buildDayItems(y,m,d);
    const CAP = 3;
    const shown = items.slice(0,CAP);
    const extra = items.length - shown.length;
    cells += `<div class="cal-day"><span class="cal-num">${d}</span>`+
      shown.map(it=>`<span class="cal-dot" data-item-idx="${registerClickable(it)}" style="background:${it.bg};cursor:pointer;" title="${it.title} ${it.sub||''}">${it.kind==='google'?googleBadgeHTML():''}${it.timeLabel?it.timeLabel+' ':''}${it.title}</span>`).join('')+
      (extra>0 ? `<span class="cal-more">+${extra} more</span>` : '')+
      `</div>`;
  }
  const html = `
    <div class="cal-grid-scroll">
      <div class="cal-grid">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>`;
  return {html, label};
}

function mondayOf(iso){
  const d = new Date(iso+'T00:00:00');
  const day = d.getDay(); // 0=Sun..6=Sat
  const diff = (day===0) ? -6 : (1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}

function renderAgenda(numDays, startIso){
  const anchor = new Date((startIso || state.calAnchor)+'T00:00:00');
  const todayIso = new Date().toISOString().slice(0,10);
  let rows = '';
  let firstDate=null, lastDate=null;
  for(let i=0;i<numDays;i++){
    const d = new Date(anchor); d.setDate(anchor.getDate()+i);
    const y=d.getFullYear(), m=d.getMonth(), day=d.getDate();
    if(i===0) firstDate=d;
    lastDate=d;
    const {iso, items} = buildDayItems(y,m,day);
    const isToday = iso===todayIso;
    const dLabel = d.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
    rows += `<div class="agenda-day">
      <div class="agenda-day-header ${isToday?'today':''}">${dLabel}${isToday?' · Today':''}</div>
      ${items.length===0 ? `<div class="agenda-empty">Nothing scheduled</div>` :
        items.map(it=>`<div class="agenda-item" data-item-idx="${registerClickable(it)}" style="cursor:pointer;">
          <div class="agenda-time">${it.timeLabel||'—'}</div>
          <div class="agenda-swatch" style="background:${it.bg};"></div>
          <div>
            <div class="agenda-title">${it.kind==='google'?googleBadgeHTML():''}${it.title}</div>
            ${it.sub?`<div class="agenda-sub">${it.sub}</div>`:''}
          </div>
        </div>`).join('')}
    </div>`;
  }
  const label = numDays===1
    ? firstDate.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'})
    : `${firstDate.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${lastDate.toLocaleDateString('en-US',{month:'short',day:'numeric', year:'numeric'})}`;
  return {html: rows, label};
}

function renderCalendar(){

  clickableItems = [];

    const r = renderMonthGrid();

  return `

      <span class="status-line" id="calSyncStatus" style="margin-top:0;font-size:0.68rem;" title="${getSyncTargets().map(c=>c.name.trim()).join(', ')}">→ <strong style="color:var(--ink);">${getSyncTargets().length>1 ? `${getSyncTargets().length} calendars` : (getSyncTargets()[0]?.name.trim()||'')}</strong>${getSyncTargets().every(c=>c.id)?` <span style="color:var(--green);">✓</span>`:` <span style="color:var(--stamp-dark);">(set in Settings)</span>`}</span>
      <button class="btn small" id="calSyncAllBtn" ${unsyncedCount===0?'':''} style="background:${unsyncedCount===0?'var(--green)':'var(--stamp)'};color:#fff;${unsyncedCount===0?'opacity:1;cursor:default;pointer-events:none;':''}">${unsyncedCount===0?'All synced ✓':`Sync all to Calendar (${unsyncedCount})`}</button>
    </div>
    <div class="row" style="margin-top:-8px;">
      <span class="status-line" id="calPullStatus" style="margin-top:0;">${state.googleYearLoading?'Loading from Google...':state.googleEventsYearLoaded?`Synced with Google (☁).`:'Not showing your existing Google Calendar events yet.'}</span>
      <button class="btn secondary small" id="calPullBtn" ${state.googleYearLoading?'disabled':''}>${state.googleEventsYearLoaded?'Refresh this month from Google':'Load this month from Google'}</button>
    </div>
    ${renderFilterBar()}

function attachHandlers(){
  const addBtn = document.getElementById('addBtn');
  if(addBtn) addBtn.onclick = openAddModal;

  document.querySelectorAll('.class-group').forEach(det=>{
    det.addEventListener('toggle', ()=>{
      state.classGroupOpen[det.dataset.groupKey] = det.open;
    });
  });

  document.querySelectorAll('.filter-chip').forEach(chip=>{
    chip.onclick = ()=>{
      const kind = chip.dataset.filterKind; // 'class' or 'type'
      const val = chip.dataset.filterVal;
      const set = kind==='class' ? state.cardFilters.classes : state.cardFilters.types;
      if(set.has(val)) set.delete(val); else set.add(val);
      render();
    };
  });

  const addClassBtn = document.getElementById('addClassBtn');
  if(addClassBtn) addClassBtn.onclick = openClassModal;

  document.querySelectorAll('[data-class-tile]').forEach(tile=>{
    tile.onclick = ()=>{
      const c = state.courses.find(x=>x.id===tile.dataset.classTile);
      if(c) openItemEditModal({kind:'class', ref:c});
    };
  });

  document.querySelectorAll('[data-act]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id; const act = btn.dataset.act;
      const a = state.assignments.find(x=>x.id===id);
      if(act==='toggle'){ a.done = !a.done; await saveAssignments(); render(); }
      else if(act==='del'){ state.assignments = state.assignments.filter(x=>x.id!==id); await saveAssignments(); render(); }
      else if(act==='sync'){ await syncToCalendar(a); }
      else if(act==='unsync'){
        if(a.googleEventIds) await deleteEventOnAllTargets(a.googleEventIds);
        a.synced = false; a.syncError = false; a.googleEventIds = {};
        await saveAssignments();
        render();
      }
    };
  });

  document.querySelectorAll('[data-cact]').forEach(btn=>{
    btn.onclick = async (ev)=>{
      ev.stopPropagation();
      const id = btn.dataset.cid; const act = btn.dataset.cact;
      const c = state.courses.find(x=>x.id===id);
      if(act==='delClass'){
        await unsyncClassAndItsAssignments(c);
        state.courses = state.courses.filter(x=>x.id!==id);
        await saveCourses(); render();
      }
      else if(act==='syncClass'){ await syncClassToCalendar(c); }
      else if(act==='unsyncClass'){
        btn.textContent = 'Removing...'; btn.disabled = true;
        await unsyncClassAndItsAssignments(c);
        render();
      }
    };
  });

  document.querySelectorAll('[data-class-card]').forEach(card=>{
    card.onclick = ()=>{
      const c = state.courses.find(x=>x.id===card.dataset.classCard);
      if(c) openClassDetailModal(c);
    };
  });

  const viewBtns = document.querySelectorAll('.view-switch button[data-view]');
  viewBtns.forEach(b=>{
    b.onclick = ()=>{
      state.calView = b.dataset.view;
      if(state.calView!=='month'){
        // when entering an agenda view, anchor it near today (or keep existing anchor)
        if(!state.calAnchor) state.calAnchor = new Date().toISOString().slice(0,10);
      }
      render();
    };
  });

  const prevCal = document.getElementById('prevCal'), nextCal = document.getElementById('nextCal');
  const shiftAnchor = (days)=>{
    const d = new Date(state.calAnchor+'T00:00:00');
    d.setDate(d.getDate()+days);
    state.calAnchor = d.toISOString().slice(0,10);
  };
  if(prevCal) prevCal.onclick = ()=>{
    if(state.calView==='month'){ const now=new Date(); let y=state.calY??now.getFullYear(), m=state.calM??now.getMonth(); m--; if(m<0){m=11;y--;} state.calY=y; state.calM=m; }
    else { const step = state.calView==='day'?1:7; shiftAnchor(-step); }
    render();
  };
  if(nextCal) nextCal.onclick = ()=>{
    if(state.calView==='month'){ const now=new Date(); let y=state.calY??now.getFullYear(), m=state.calM??now.getMonth(); m++; if(m>11){m=0;y++;} state.calY=y; state.calM=m; }
    else { const step = state.calView==='day'?1:7; shiftAnchor(step); }
    render();
  };

  const calSyncAll = document.getElementById('calSyncAllBtn');
  if(calSyncAll) calSyncAll.onclick = syncAllFromCalendarTab;

  const calPull = document.getElementById('calPullBtn');
  if(calPull) calPull.onclick = pullGoogleEvents;

  const newEventBtn = document.getElementById('newEventBtn');
  if(newEventBtn) newEventBtn.onclick = openNewEventModal;

  document.querySelectorAll('[data-item-idx]').forEach(el=>{
    el.onclick = ()=>{
      const it = clickableItems[+el.dataset.itemIdx];
      if(it) openItemEditModal(it);
    };
  });

  const loadCals = document.getElementById('loadCalsBtn');
  if(loadCals) loadCals.onclick = loadGoogleCalendars;

  if(state.calendarOptions) renderCalPicker();

  const dupToggle = document.getElementById('dupToggle');
  if(dupToggle) dupToggle.onchange = async (e)=>{
    state.settings.showSyncedDuplicates = e.target.checked;
    await saveSettings();
  };

  const dz = document.getElementById('dropZone');
  const fi = document.getElementById('fileInput');
  if(dz){
    dz.onclick = ()=>fi.click();
    dz.ondragover = e=>{e.preventDefault(); dz.classList.add('drag');};
    dz.ondragleave = ()=>dz.classList.remove('drag');
    dz.ondrop = e=>{e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);};
    fi.onchange = ()=>{ if(fi.files[0]) handleFile(fi.files[0]); };
  }
}

async function handleFile(file){
  const statusEl = document.getElementById('scanStatus');
  statusEl.textContent = 'Reading file...';
  let text = '';
  try{
    if(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')){
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data: buf}).promise;
      for(let p=1; p<=pdf.numPages; p++){
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        text += content.items.map(i=>i.str).join(' ') + '\n';
      }
    } else {
      text = await file.text();
    }
  }catch(e){
    statusEl.textContent = 'Could not read that file. Try a PDF or .txt syllabus.';
    return;
  }
  if(!text.trim()){ statusEl.textContent = 'No readable text found in that file.'; return; }
  statusEl.textContent = 'Scanning for quizzes, tests, and due dates...';
  await extractDates(text.slice(0, 15000), statusEl);
}

async function extractDates(text, statusEl){
  try{
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/scan-syllabus`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ text })
    });
    const data = await resp.json();
    const items = Array.isArray(data.items) ? data.items : [];
    if(!resp.ok){
      statusEl.textContent = `Scan failed: ${data.error || 'unknown error'}. You can still add assignments manually.`;
      return;
    }
    if(items.length===0){
      statusEl.textContent = 'No dated items found. You can still add assignments manually.';
      return;
    }
    statusEl.textContent = `Found ${items.length} item(s). Review and select what to add:`;
    renderScanResults(items);
  }catch(e){
    statusEl.textContent = 'Something went wrong reading dates from that file. You can add assignments manually instead.';
  }
}

// ---- Pull existing events FROM Google Calendar for the currently viewed month ----
function currentRefMonth(){
  // which year/month is "in view" right now, based on the active calendar view
  if(state.calView==='month'){
    const now = new Date();
    return { y: state.calY ?? now.getFullYear(), m: state.calM ?? now.getMonth() };
  }
  const d = new Date((state.calAnchor || new Date().toISOString().slice(0,10))+'T00:00:00');
  return { y: d.getFullYear(), m: d.getMonth() };
}

async function pullGoogleEvents(){
  const { y, m } = currentRefMonth();
  const monthKey = `${y}-${m}`;
  const monthLabel = new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const start = `${y}-${String(m+1).padStart(2,'0')}-01`;
  const endDate = new Date(y, m+1, 0);
  const end = `${y}-${String(m+1).padStart(2,'0')}-${String(endDate.getDate()).padStart(2,'0')}`;
  const statusEl = document.getElementById('calPullStatus');
  const btn = document.getElementById('calPullBtn');
  const classTargets = getSyncTargets();
  const assignTargets = getAssignmentSyncTargets();
  const targets = [...classTargets, ...assignTargets.filter(at=>!classTargets.some(ct=>(ct.id||ct.name)===(at.id||at.name)))];
  state.googleYearLoading = true;
  if(statusEl) statusEl.textContent = `Loading ${monthLabel} from Google (${targets.length} calendar${targets.length>1?'s':''})...`;
  if(btn) btn.disabled = true;
  let events = [];
  let anyOk = false;
  for(const target of targets){
    const calKey = target.id || target.name;
    try{
      const q = new URLSearchParams({ calendarId: target.id || 'primary', timeMin: `${start}T00:00:00Z`, timeMax: `${end}T23:59:59Z` });
      const resp = await fetch(`${CALSYNC_URL}/events?${q.toString()}`, {
        headers: { Authorization: `Bearer ${SUPABASE_KEY}` }
      });
      const data = await resp.json();
      if(resp.ok && Array.isArray(data.events)){
        anyOk = true;
        data.events.forEach(e=>{
          const rawStart = e.start?.dateTime || e.start?.date;
          if(!rawStart) return;
          const iso = String(rawStart).slice(0,10);
          const hasTime = String(rawStart).includes('T');
          const time = hasTime ? String(rawStart).slice(11,16) : '';
          const rawEnd = e.end?.dateTime || e.end?.date || '';
          const endTime = (rawEnd && String(rawEnd).includes('T')) ? String(rawEnd).slice(11,16) : '';
          const location = e.location || '';
          const gid = e.id || '';
          const color = e.colorId ? GOOGLE_COLOR_MAP[e.colorId] : (target.color || '#4285F4');
          events.push({ id: gid, calendarKey: calKey, calendarName: target.name, title: e.summary || 'Untitled event', date: iso, time, endTime, location, color });
        });
      }
    }catch(e){ /* keep going with the other calendars */ }
  }
  if(anyOk){
    state.googleEvents[monthKey] = events;
    state.googleLoadedMonths = state.googleLoadedMonths || {};
    state.googleLoadedMonths[monthKey] = true;
    state.googleEventsYearLoaded = true; // reused as "has loaded at least one month" flag
    if(events.length===0 && statusEl) statusEl.textContent = `No events found on Google for ${monthLabel} (or none could be read).`;
  } else if(statusEl){
    statusEl.textContent = 'Could not fetch events from Google Calendar. Check your connection and try again.';
  }
  state.googleYearLoading = false;
  render();
}


async function syncAllFromCalendarTab(){
  const pendingAssignments = state.assignments.filter(a=>!a.synced);
  const pendingClasses = state.courses.filter(c=>!c.synced);
  const total = pendingAssignments.length + pendingClasses.length;
  const setStatus = (txt)=>{ const el = document.getElementById('calSyncStatus'); if(el) el.textContent = txt; };
  if(total===0){ setStatus('Nothing to sync.'); return; }
  let done = 0;
  for(const c of pendingClasses){
    setStatus(`Syncing ${++done}/${total}: ${c.name} (class)...`);
    await syncClassToCalendar(c);
  }
  for(const a of pendingAssignments){
    setStatus(`Syncing ${++done}/${total}: ${a.title}...`);
    await syncToCalendar(a);
  }
  setStatus(`Done — synced ${total} item(s) to ${state.settings.calendarName}.`);
}


async function updateEventOnTarget(target, eventId, fields){
  if(!eventId) return false;
  try{
    const resp = await fetch(CALSYNC_URL+'/events', {
      method:'PATCH',
      headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({
        calendarId: target.id || 'primary', eventId,
        title: fields.title, date: fields.date, time: fields.time, endTime: fields.endTime,
        location: fields.location, notes: fields.notes
      })
    });
    return resp.ok;
  }catch(e){ return false; }
}

async function deleteEventOnTarget(target, eventId){
  if(!eventId) return false;
  try{
    const resp = await fetch(CALSYNC_URL+'/events', {
      method:'DELETE',
      headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ calendarId: target.id || 'primary', eventId })
    });
    return resp.ok;
  }catch(e){ return false; }
}

function repeatToRRule(repeat){
  if(!repeat || repeat==='none') return undefined;
  const freq = {daily:'DAILY', weekly:'WEEKLY', monthly:'MONTHLY'}[repeat];
  return freq ? `RRULE:FREQ=${freq}` : undefined;
}

async function createEventOnTarget(target, fields){
  try{
    const resp = await fetch(CALSYNC_URL+'/events', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({
        calendarId: target.id || 'primary', title: fields.title, date: fields.date,
        time: fields.time, endTime: fields.endTime, allDay: fields.allDay,
        location: fields.location, notes: fields.notes,
        reminders: fields.reminders, recurrence: fields.recurrence || repeatToRRule(fields.repeat)
      })
    });
    const data = await resp.json();
    if(resp.ok && data.id) return { ok:true, id: data.id };
    return { ok:false, id:'' };
  }catch(e){ return { ok:false, id:'' }; }
}

// ---- Multi-calendar wrappers: fan a single logical action out across every configured calendar ----
async function createEventOnAllTargets(fields){
  const targets = getSyncTargets();
  const ids = {};
  let successCount = 0;
  for(const t of targets){
    const key = t.id || t.name;
    const r = await createEventOnTarget(t, fields);
    if(r.ok){ ids[key] = r.id; successCount++; }
  }
  return { ids, successCount, total: targets.length };
}

async function updateEventOnAllTargets(idsMap, fields){
  if(!idsMap) return { successCount:0, total:0 };
  const entries = Object.entries(idsMap);
  let successCount = 0;
  for(const [key, eventId] of entries){
    const target = { id: key, name: key };
    const ok = await updateEventOnTarget(target, eventId, fields);
    if(ok) successCount++;
  }
  return { successCount, total: entries.length };
}

async function deleteEventOnAllTargets(idsMap){
  if(!idsMap) return { successCount:0, total:0 };
  const entries = Object.entries(idsMap);
  let successCount = 0;
  for(const [key, eventId] of entries){
    // the stored key is always the real calendar id it was created on — use it directly rather than
    // re-resolving through whichever target list happens to be active, which can silently mismatch
    // between class calendars and the dedicated assignment calendar
    const target = { id: key, name: key };
    const ok = await deleteEventOnTarget(target, eventId);
    if(ok) successCount++;
  }
  return { successCount, total: entries.length };
}

// Removes a class's own recurring lecture event AND every assignment belonging to that
// class that's synced to the calendar too — a full "unsync this whole course" action.
async function unsyncClassAndItsAssignments(c){
  try{
    if(c.googleEventIds && Object.keys(c.googleEventIds).length>0){
      const result = await deleteEventOnAllTargets(c.googleEventIds);
      if(result.successCount >= result.total){
        c.synced = false; c.syncError = false; c.googleEventIds = {};
      } else {
        c.syncError = true; // some deletions failed — keep the ids so a retry can find them
      }
      await saveCourses();
    }

    const matched = state.assignments.filter(a=>assignmentMatchesCourse(a,c) && a.googleEventIds && Object.keys(a.googleEventIds).length>0);
    let anyChanged = false;
    for(const a of matched){
      const result = await deleteEventOnAllTargets(a.googleEventIds);
      if(result.successCount >= result.total){
        a.synced = false; a.syncError = false; a.googleEventIds = {};
      } else {
        a.syncError = true;
      }
      anyChanged = true;
    }
    if(anyChanged) await saveAssignments();
  }catch(e){
    c.syncError = true;
    await saveCourses();
  }
}

    <div class="field" style="display:flex;align-items:center;gap:8px;margin-top:2px;">

      <label style="margin:0;text-transform:none;font-family:'Inter',sans-serif;font-size:0.85rem;color:var(--ink);">All day</label>
    </div>
    <div class="field"><label>Date</label><input id="ne_date" type="date" value="${todayIso}"></div>
    <div id="ne_timerow" style="display:flex;gap:8px;">
      <div class="field" style="flex:1;"><label>Start time</label><input id="ne_start" type="time" value="09:00"></div>

    </div>

        <option value="none">Does not repeat</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
    </div>
    <div class="field"><label>Location (optional)</label><input id="ne_loc" placeholder="Add location"></div>
    <div class="field"><label>Description (optional)</label><textarea id="ne_notes" placeholder="Add description"></textarea></div>
    <div class="row" style="margin-top:6px;">
      <button class="btn secondary" id="ne_cancel">Cancel</button>
      <button class="btn stamp-btn" id="ne_save">Save</button>
    </div>
    <div class="status-line" id="ne_status"></div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#ne_cancel').onclick = ()=>bg.remove();
  bg.querySelector('#ne_allday').onchange = (e)=>{
    document.getElementById('ne_timerow').style.display = e.target.checked ? 'none' : 'flex';
  };
  bg.querySelector('#ne_save').onclick = async ()=>{
    const title = bg.querySelector('#ne_title').value.trim();
    if(!title){ bg.querySelector('#ne_title').style.borderColor='var(--stamp)'; return; }
    const allDay = bg.querySelector('#ne_allday').checked;
    const date = bg.querySelector('#ne_date').value;
    const time = allDay ? '' : bg.querySelector('#ne_start').value;
    const endTime = allDay ? '' : bg.querySelector('#ne_end').value;
    const repeat = bg.querySelector('#ne_repeat').value;
    const location = bg.querySelector('#ne_loc').value.trim();
    const notes = bg.querySelector('#ne_notes').value.trim();
    const statusEl = bg.querySelector('#ne_status');
    statusEl.textContent = 'Saving to Google Calendar...';
    bg.querySelector('#ne_save').disabled = true;
    const result = await createEventOnAllTargets({title, date, time, endTime, allDay, repeat, location, notes});
    if(result.successCount>0){
      const [y,mo] = date.split('-').map(Number);
      const monthKey = `${y}-${mo-1}`;
      state.googleEvents[monthKey] = state.googleEvents[monthKey] || [];
      Object.entries(result.ids).forEach(([calKey,eventId])=>{
        const target = getSyncTargets().find(t=>(t.id||t.name)===calKey);
        state.googleEvents[monthKey].push({ id: eventId, calendarKey: calKey, calendarName: target?.name||'', title, date, time, endTime, location, color: target?.color||'#4285F4' });
      });
      bg.remove();
      render();
      if(result.successCount < result.total) alert(`Saved to ${result.successCount} of ${result.total} calendars — check the others.`);
    } else {
      statusEl.textContent = 'Could not save this event to Google Calendar. Try again.';
      bg.querySelector('#ne_save').disabled = false;
    }
  };
}

async function syncClassToCalendar(c){
  if(c.synced && !c.syncError) return; // dedupe guard: don't re-sync a class that's already fully synced
  const btn = [...document.querySelectorAll('[data-cid="'+c.id+'"][data-cact="syncClass"]')][0];
  if(btn){ btn.textContent = 'Syncing...'; btn.disabled = true; }
  const hasClassEvent = c.googleEventIds && Object.keys(c.googleEventIds).length>0;
  try{
    const daysMap = {Sun:'SU',Mon:'MO',Tue:'TU',Wed:'WE',Thu:'TH',Fri:'FR',Sat:'SA'};
    const byday = (c.days||[]).map(d=>daysMap[d]).filter(Boolean).join(',');
    const targets = getSyncTargets();
    const ids = {};
    let successCount = 0;
    const today = new Date();
    const dayNums = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
    const targetDays = (c.days||[]).map(d=>dayNums[d]).filter(n=>n!==undefined);
    let anchor = new Date(today);
    if(targetDays.length>0){
      for(let i=0;i<7;i++){
        if(targetDays.includes(anchor.getDay())) break;
        anchor.setDate(anchor.getDate()+1);
      }
    }
    const anchorDate = anchor.toISOString().slice(0,10);
    const untilPart = c.termEnds ? `;UNTIL=${c.termEnds.replace(/-/g,'')}T235959Z` : '';
    const recurrence = byday ? `RRULE:FREQ=WEEKLY;BYDAY=${byday}${untilPart}` : undefined;

    // only attempt the class's own lecture-time event if it has meeting days and isn't already synced
    if(byday && !hasClassEvent){
      for(const target of targets){
        const r = await createEventOnTarget(target, {
          title: `${c.name} (Class)`, date: anchorDate, time: c.startTime || '09:00', endTime: c.endTime || '10:00',
          location: c.location || '', recurrence
        });
        if(r.ok){ ids[target.id||target.name] = r.id; successCount++; }
      }
      if(successCount>0){
        c.synced = true;
        c.syncError = successCount < targets.length;
        c.googleEventIds = ids;
      } else {
        c.syncError = true;
      }
      await saveCourses();
    }

    // sync every matching assignment too
    const matched = state.assignments.filter(a=>assignmentMatchesCourse(a,c) && !a.synced);
    if(matched.length>0){
      for(const a of matched){
        await syncToCalendar(a, true); // quiet=true: skip individual button DOM lookups, we're batching
      }
      await saveAssignments();
      if(!byday){ c.synced = true; c.syncError = false; await saveCourses(); } // no class meeting time, but assignments synced fine
    }
  }catch(e){
    c.syncError = true;
    await saveCourses();
  }
  render();
}


async function syncToCalendar(a, quiet){
  const card = quiet ? null : [...document.querySelectorAll('[data-id="'+a.id+'"][data-act="sync"]')][0];
  if(card){ card.textContent = 'Syncing...'; card.disabled = true; }
  try{
    const targets = getAssignmentSyncTargets();
    const ids = {};
    let successCount = 0;
    const REMINDER_MINUTES = [10080, 4320, 2880, 1440]; // 1wk, 3d, 48h, 24h before

    for(const target of targets){
      const r = await createEventOnTarget(target, {
        title: `${a.title}${a.course ? ' — '+a.course : ''}`,
        date: a.date || new Date().toISOString().slice(0,10),
        time: a.time || '', endTime: a.time ? (a.endTime || a.time) : '',
        allDay: !a.time,
        location: a.location || '',
        notes: `${a.notes||''} (Type: ${a.type})`,
        reminders: REMINDER_MINUTES
      });
      if(r.ok){ ids[target.id||target.name] = r.id; successCount++; }
    }
    if(successCount>0){
      a.synced = true;
      a.syncError = successCount < targets.length;
      a.googleEventIds = ids;
      if(!quiet) await saveAssignments();
    } else {
      a.syncError = true;
      if(!quiet) await saveAssignments();
    }
  }catch(e){
    a.syncError = true;
    if(!quiet) await saveAssignments();
  }
  if(!quiet) render();
}
